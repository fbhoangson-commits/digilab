name = "vietau-library-api"
main = "worker/index.ts"
compatibility_date = "2026-11-02"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "vietau-library"
database_id = "REPLACE_WITH_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BOOKS"
bucket_name = "vietau-library"

[vars]
APP_NAME = "VIỆT ÂU DIGITAL LIBRARY"
